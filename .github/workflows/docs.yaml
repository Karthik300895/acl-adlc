name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "website/**"
      - "tools/build-docs.mjs"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # No big win in setting this to true — risk of cancelling a deploy mid-flight.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history needed for Starlight's lastUpdated timestamps (git log)
          fetch-depth: 0

      - name: Ensure docs content symlink
        run: |
          LINK="website/src/content/docs"
          TARGET="../../../docs"
          if [ -L "$LINK" ] && [ -e "$LINK" ]; then
            echo "docs symlink is valid: $(readlink "$LINK")"
          else
            echo "Recreating docs symlink for Starlight content loader"
            rm -f "$LINK"
            ln -s "$TARGET" "$LINK"
          fi
          test -d "$LINK" || { echo "docs content directory is missing after symlink setup"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        env:
          # Override site URL from GitHub repo variable if set.
          # Otherwise, astro.config.mjs computes https://<owner>.github.io/<repo>.
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run docs:build

      - name: Verify build output
        run: |
          test -d build/site || { echo "build/site was not created"; exit 1; }
          test -f build/site/index.html || { echo "build/site/index.html is missing"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
